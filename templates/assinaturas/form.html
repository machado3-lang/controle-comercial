{% extends "base.html" %}
{% block title %}Editar Assinatura{% endblock %}
{% block content %}
<div class="glass-card mb-6">
    <div class="p-4 border-b border-slate-800/60 flex justify-between items-center">
        <h4 class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-semibold"><i data-lucide="calendar-check" class="w-6 h-6 inline me-2"></i> Editar Assinatura</h4>
        <a href="/assinaturas" class="flex items-center px-3 py-2 text-slate-300 border border-slate-700 rounded-xl hover:bg-slate-800/50 transition"><i data-lucide="arrow-left" class="w-4 h-4 me-1"></i> Cancelar</a>
    </div>
    
    <form method="post" class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Cliente *</label>
            <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="cliente_id" required>
                {% for c in clientes %}<option value="{{ c.id }}" {% if assinatura.cliente_id == c.id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}
            </select>
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Periodicidade *</label>
            <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="periodicidade" required>
                <option value="1" {% if assinatura.periodicidade == 1 %}selected{% endif %}>Mensal</option>
                <option value="2" {% if assinatura.periodicidade == 2 %}selected{% endif %}>Bimestral</option>
                <option value="3" {% if assinatura.periodicidade == 3 %}selected{% endif %}>Trimestral</option>
                <option value="4" {% if assinatura.periodicidade == 4 %}selected{% endif %}>Semestral</option>
                <option value="5" {% if assinatura.periodicidade == 5 %}selected{% endif %}>Anual</option>
            </select>
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Situação</label>
            <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="situacao">
                <option value="0" {% if assinatura.situacao == 0 %}selected{% endif %}>Inativo</option>
                <option value="1" {% if assinatura.situacao == 1 %}selected{% endif %}>Ativo</option>
                <option value="2" {% if assinatura.situacao == 2 %}selected{% endif %}>Baixado</option>
            </select>
        </div>
        <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Descrição *</label>
            <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="descricao" required value="{{ assinatura.descricao }}">
        </div>
        <div><label class="block text-xs font-medium text-emerald-400 mb-1">Valor *</label>
            <input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="valor" required value="{{ assinatura.valor }}">
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Dia Vencimento *</label>
            <input type="number" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="dia_vencimento" min="1" max="31" required value="{{ assinatura.dia_vencimento }}">
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Data Início *</label>
            <input type="date" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_inicio" required value="{{ assinatura.data_inicio }}">
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Data Fim</label>
            <input type="date" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_fim" value="{{ assinatura.data_fim if assinatura.data_fim else '' }}">
        </div>
        <div class="md:col-span-3"><button type="submit" class="flex items-center px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/10"><i data-lucide="save" class="w-4 h-4 me-1"></i> Salvar</button></div>
    </form>
</div>

{% block scripts %}
<script>document.addEventListener('DOMContentLoaded', function() { lucide.createIcons(); });</script>
{% endblock %}
{% endblock %}
