<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="md:col-span-2 relative">
        <label class="block text-xs font-medium text-cyan-400 mb-1">Cliente</label>
        <input type="text" id="clienteSearchNova" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" placeholder="Digite para buscar..." autocomplete="off">
        <div id="clienteDropdownNova" class="absolute z-[1000] w-full bg-slate-900/90 backdrop-blur-md border border-slate-700/50 rounded-xl mt-1 hidden max-h-60 overflow-y-auto"></div>
        <select class="hidden" name="cliente_id" id="clienteIdNova">
            <option value="">Selecione...</option>
            {% for c in clientes %}<option value="{{ c.id }}">{{ c.nome }}</option>{% endfor %}
        </select>
    </div>
    <div><label class="block text-xs font-medium text-emerald-400 mb-1">Valor *</label>
        <input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="valor" required>
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Vencimento *</label>
        <input type="date" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_vencimento" required>
    </div>
    <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Descrição *</label>
        <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="descricao" required>
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Nº Documento</label>
        <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="numero_documento">
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Forma Pagamento</label>
        <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="forma_pagamento">
            <option value="">Selecione...</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="pix">PIX</option>
            <option value="cartao_credito">Cartão de Crédito</option>
            <option value="cartao_debito">Cartão de Débito</option>
            <option value="boleto">Boleto</option>
            <option value="transferencia">Transferência</option>
            <option value="cheque">Cheque</option>
            <option value="outro">Outro</option>
        </select>
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Tipo Documento</label>
        <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="tipo_documento_id">
            <option value="">Selecione...</option>
            {% for td in tipos_documento %}<option value="{{ td.id }}">{{ td.nome }}</option>{% endfor %}
        </select>
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Plano de Contas (Receita)</label>
        <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="plano_conta_id" required>
            <option value="">Selecione...</option>
            {% for pc in planos_contas %}<option value="{{ pc.id }}">{{ pc.codigo }} - {{ pc.nome }}</option>{% endfor %}
        </select>
    </div>
    <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Observação</label>
        <textarea class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="observacao" rows="2"></textarea>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const clientesData = {{ clientes_json|tojson }};
    const clienteSearch = document.getElementById('clienteSearchNova');
    const clienteDropdown = document.getElementById('clienteDropdownNova');
    if (clienteSearch) {
        clienteSearch.addEventListener('input', function(e) {
            const term = e.target.value;
            if (term.length >= 2) {
                fetch(`/clientes/buscar?q=${encodeURIComponent(term)}`).then(r => r.json()).then(d => {
                    if (d.clientes && d.clientes.length > 0) {
                        clienteDropdown.innerHTML = d.clientes.map(c => `<div class="p-2.5 hover:bg-slate-800/50 cursor-pointer transition" data-id="${c.id}">${formatPessoaItem(c)}</div>`).join('');
                        clienteDropdown.classList.remove('hidden');
                    } else {
                        clienteDropdown.classList.add('hidden');
                    }
                });
            } else {
                clienteDropdown.classList.add('hidden');
            }
        });
    }
    if (clienteDropdown) {
        clienteDropdown.addEventListener('click', function(e) {
            const item = e.target.closest('[data-id]');
            if (item) {
                clienteSearch.value = item.textContent;
                document.getElementById('clienteIdNova').value = item.dataset.id;
                this.classList.add('hidden');
            }
        });
    }
});
</script>
