<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="md:col-span-2 relative">
        <label class="block text-xs font-medium text-cyan-400 mb-1">Fornecedor</label>
        <input type="text" id="fornecedorSearchNovaPagar" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" placeholder="Digite para buscar..." autocomplete="off">
        <div id="fornecedorDropdownNovaPagar" class="absolute z-[1000] w-full bg-slate-900/90 backdrop-blur-md border border-slate-700/50 rounded-xl mt-1 hidden max-h-60 overflow-y-auto"></div>
        <select class="hidden" name="fornecedor_id" id="fornecedorIdNovaPagar">
            <option value="">Selecione...</option>
            {% for f in fornecedores %}<option value="{{ f.id }}">{{ f.nome }}</option>{% endfor %}
        </select>
    </div>
    <div><label class="block text-xs font-medium text-emerald-400 mb-1">Valor *</label>
        <input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="valor" required>
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Vencimento *</label>
        <input type="date" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_vencimento" required>
    </div>
    <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Descrição *</label>
        <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="descricao" required>
    </div>
    <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Observação</label>
        <textarea class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="observacao" rows="2"></textarea>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fornecedoresData = {{ fornecedores_json|tojson }};
    const fornecedorSearch = document.getElementById('fornecedorSearchNovaPagar');
    const fornecedorDropdown = document.getElementById('fornecedorDropdownNovaPagar');
    if (fornecedorSearch) {
        fornecedorSearch.addEventListener('input', function(e) {
            const term = e.target.value;
            if (term.length >= 2) {
                fetch(`/fornecedores/buscar?q=${encodeURIComponent(term)}`).then(r => r.json()).then(d => {
                    if (d.fornecedores && d.fornecedores.length > 0) {
                        fornecedorDropdown.innerHTML = d.fornecedores.map(f => `<div class="p-2.5 hover:bg-slate-800/50 cursor-pointer transition" data-id="${f.id}">${f.nome}${f.fantasia && f.fantasia !== f.nome ? ' - ' + f.fantasia : ''}${f.cpf_cnpj ? ' (<span class="text-cyan-400">' + f.cpf_cnpj + '</span>)' : ''}</div>`).join('');
                        fornecedorDropdown.classList.remove('hidden');
                    } else {
                        fornecedorDropdown.classList.add('hidden');
                    }
                });
            } else {
                fornecedorDropdown.classList.add('hidden');
            }
        });
    }
    if (fornecedorDropdown) {
        fornecedorDropdown.addEventListener('click', function(e) {
            const item = e.target.closest('[data-id]');
            if (item) {
                fornecedorSearch.value = item.textContent;
                document.getElementById('fornecedorIdNovaPagar').value = item.dataset.id;
                this.classList.add('hidden');
            }
        });
    }
});
</script>
