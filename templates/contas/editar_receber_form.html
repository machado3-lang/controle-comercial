<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="md:col-span-2 relative">
        <label class="block text-xs font-medium text-cyan-400 mb-1">Cliente</label>
        <input type="text" id="clienteSearchEditar" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" placeholder="Digite para buscar..." autocomplete="off">
        <div id="clienteDropdownEditar" class="absolute z-[1000] w-full bg-slate-900/90 backdrop-blur-md border border-slate-700/50 rounded-xl mt-1 hidden max-h-60 overflow-y-auto"></div>
        <select class="hidden" name="cliente_id" id="clienteIdEditar">
            <option value="">Selecione...</option>
            {% for c in clientes %}<option value="{{ c.id }}" {% if conta and conta.cliente_id == c.id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}
        </select>
    </div>
    <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Descrição *</label>
        <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="descricao" required value="{{ conta.descricao if conta else '' }}">
    </div>
    <div><label class="block text-xs font-medium text-emerald-400 mb-1">Valor *</label>
        <input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="valor" required value="{{ conta.valor if conta else '' }}">
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Vencimento *</label>
        <input type="date" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_vencimento" required value="{{ conta.data_vencimento if conta and conta.data_vencimento else '' }}">
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Status</label>
        <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="status">
            <option value="pendente" {% if conta and conta.status.value == 'pendente' %}selected{% endif %}>Pendente</option>
            <option value="vencido" {% if conta and conta.status.value == 'vencido' %}selected{% endif %}>Vencido</option>
            <option value="pago" {% if conta and conta.status.value == 'pago' %}selected{% endif %}>Pago</option>
            <option value="cancelado" {% if conta and conta.status.value == 'cancelado' %}selected{% endif %}>Cancelado</option>
        </select>
    </div>
    <div><label class="block text-xs font-medium text-cyan-400 mb-1">Data Recebimento</label>
        <input type="date" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_recebimento" value="{{ conta.data_recebimento if conta and conta.data_recebimento else '' }}">
    </div>
    <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Observação</label>
        <textarea class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="observacao" rows="3">{{ conta.observacao if conta else '' }}</textarea>
    </div>
</div>
