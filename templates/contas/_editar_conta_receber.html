<div class="mb-3 relative">
    <label class="form-label text-cyan-300">Cliente</label>
    <input type="text" id="clienteSearchEditar" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" placeholder="Digite para buscar..." autocomplete="off" value="{{ conta.cliente.nome if conta.cliente else '' }}">
    <div id="clienteDropdownEditar" class="absolute z-[1000] w-full bg-slate-900/90 backdrop-blur-md border border-slate-700/50 rounded-xl mt-1 hidden max-h-60 overflow-y-auto"></div>
    <select class="hidden" name="cliente_id" id="clienteIdEditar">
        <option value="0">Nenhum</option>
        {% for c in clientes %}<option value="{{ c.id }}" {% if c.id == conta.cliente_id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}
    </select>
</div>
<div class="mb-3">
    <label class="form-label text-cyan-300">Descrição *</label>
    <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="descricao" required value="{{ conta.descricao }}">
</div>
<div class="mb-3">
    <label class="form-label text-cyan-300">Valor *</label>
    <input type="number" step="0.01" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="valor" required value="{{ conta.valor }}">
</div>
<div class="mb-3">
    <label class="form-label text-cyan-300">Data Vencimento *</label>
    <input type="date" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="data_vencimento" required value="{{ conta.data_vencimento.strftime('%Y-%m-%d') if conta.data_vencimento else '' }}">
</div>
<div class="mb-3">
    <label class="form-label text-cyan-300">Observação</label>
    <textarea class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="observacao" rows="2">{{ conta.observacao or '' }}</textarea>
</div>
<script>
async function buscarClientesEditar(q) {
    if (!q || q.length < 2) return [];
    try {
        const r = await fetch('/clientes/buscar?q=' + encodeURIComponent(q));
        const d = await r.json();
        return d.clientes || [];
    } catch {
        return [];
    }
}

document.addEventListener('DOMContentLoaded', function() {
    initEditarCliente();
});
(function() { initEditarCliente(); })();
function initEditarCliente() {
    const clienteSearch = document.getElementById('clienteSearchEditar');
    const clienteDropdown = document.getElementById('clienteDropdownEditar');
    if (!clienteSearch || clienteSearch._bound) return;
    clienteSearch._bound = true;
    clienteSearch.addEventListener('input', function(e) {
        const term = e.target.value;
        if (term.length >= 2) {
            buscarClientesEditar(term).then(clientes => {
                if (clientes.length > 0) {
                    clienteDropdown.innerHTML = clientes.map(c => '<div class="p-2.5 hover:bg-slate-800/50 cursor-pointer transition" data-id="' + c.id + '">' + c.nome + (c.fantasia && c.fantasia !== c.nome ? ' - ' + c.fantasia : '') + (c.cpf_cnpj ? ' (<span class="text-cyan-400">' + c.cpf_cnpj + '</span>)' : '') + '</div>').join('');
                    clienteDropdown.classList.remove('hidden');
                } else {
                    clienteDropdown.classList.add('hidden');
                }
            });
        } else {
            clienteDropdown.classList.add('hidden');
        }
    });
    if (clienteDropdown) {
        clienteDropdown.addEventListener('click', function(e) {
            const item = e.target.closest('[data-id]');
            if (item) {
                clienteSearch.value = item.textContent;
                document.getElementById('clienteIdEditar').value = item.dataset.id;
                this.classList.add('hidden');
            }
        });
    }
}
if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
