{% extends "base.html" %}
{% block title %}Serviços{% endblock %}
{% block content %}
<div class="flex flex-row items-center justify-between w-full gap-2 md:gap-3 flex-nowrap mb-6">
    <h4 class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-semibold"><i data-lucide="wrench" class="w-6 h-6 inline me-2"></i> Serviços</h4>
    <a href="/servicos/novo" class="flex items-center h-8 px-3 text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/10 flex-shrink-0"><i data-lucide="plus-circle" class="w-3.5 h-3.5 me-1"></i> Novo</a>
</div>

<div class="overflow-x-auto w-full">
    <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden">
        <table class="w-full divide-y divide-slate-800/60">
        <thead class="bg-slate-950/50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-cyan-400 uppercase tracking-wider">Nome</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-cyan-400 uppercase tracking-wider">Descrição</th>
                <th class="px-4 py-3 text-right text-xs font-semibold text-emerald-400 uppercase tracking-wider">Preço</th>
                <th class="px-4 py-3 text-center text-xs font-semibold text-cyan-400 uppercase tracking-wider">Ações</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/60">
            {% for s in servicos %}
            <tr class="hover:bg-slate-800/40 transition">
                <td class="px-4 py-3 text-sm font-medium text-slate-100">{{ s.nome }}</td>
                <td class="px-4 py-3 text-sm text-slate-300">{{ s.descricao or '-' }}</td>
                <td class="px-4 py-3 text-right text-sm text-emerald-400 font-medium">R$ {{ "%.2f"|format(s.preco_padrao/100) }}</td>
                <td class="px-4 py-3 text-center">
                    <a href="/servicos/{{ s.id }}/editar" class="inline-flex p-1.5 text-cyan-400 border border-slate-700 rounded hover:bg-cyan-950/30 transition" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></a>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="px-4 py-12 text-center text-slate-500">Nenhum serviço cadastrado</td></tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endblock %}
