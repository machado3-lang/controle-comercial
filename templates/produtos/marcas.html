{% extends "base.html" %}
{% block title %}Marcas{% endblock %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2">
        <div class="flex justify-between items-center mb-4">
            <h4 class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-semibold"><i data-lucide="bookmark" class="w-6 h-6 inline me-2"></i> Marcas de Produtos</h4>
            <a href="/produtos" class="flex items-center px-3 py-2 text-cyan-400 border border-cyan-800/50 rounded-xl hover:bg-cyan-950/30 transition"><i data-lucide="arrow-left" class="w-4 h-4 me-1"></i> Voltar</a>
        </div>
        
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden">
            <table class="w-full divide-y divide-slate-800/60">
                <thead class="bg-slate-950/50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-cyan-400 uppercase tracking-wider">Nome</th>
                        <th class="px-4 py-3 text-center text-xs font-semibold text-cyan-400 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                    {% for m in marcas %}
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="px-4 py-3 text-sm text-slate-100">{{ m.nome }}</td>
                        <td class="px-4 py-3 text-center">
                            <a href="/produtos/marcas/editar/{{ m.id }}" class="inline-block p-1.5 text-cyan-400 border border-slate-700 rounded hover:bg-cyan-950/30 transition me-1" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></a>
                            <a href="/produtos/marcas/excluir/{{ m.id }}" class="inline-block p-1.5 text-rose-400 border border-slate-700 rounded hover:bg-rose-950/30 transition" onclick="return confirm('Excluir?')" title="Excluir"><i data-lucide="trash-2" class="w-4 h-4"></i></a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="2" class="px-4 py-12 text-center text-slate-500">Nenhuma marca</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl p-6">
        {% if editar_marca %}
        <h5 class="text-emerald-400 font-semibold mb-4"><i data-lucide="pencil" class="w-5 h-5 inline me-2"></i> Editar Marca</h5>
        <form method="post" action="/produtos/marcas/editar/{{ editar_marca.id }}">
            <div class="mb-4">
                <label class="block text-xs font-medium text-cyan-400 mb-1">Nome *</label>
                <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="nome" value="{{ editar_marca.nome }}" required>
            </div>
            <button type="submit" class="w-full px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all flex items-center justify-center"><i data-lucide="save" class="w-4 h-4 me-1"></i> Atualizar</button>
            <a href="/produtos/marcas" class="w-full mt-2 px-4 py-2 text-center text-slate-400 border border-slate-700 rounded-xl hover:bg-slate-800/50 transition">Cancelar</a>
        </form>
        {% else %}
        <h5 class="text-emerald-400 font-semibold mb-4"><i data-lucide="plus-circle" class="w-5 h-5 inline me-2"></i> Nova Marca</h5>
        <form method="post" action="/produtos/marcas/nova">
            <div class="mb-4">
                <label class="block text-xs font-medium text-cyan-400 mb-1">Nome *</label>
                <input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="nome" placeholder="Nome da marca..." required>
            </div>
            <button type="submit" class="w-full px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all flex items-center justify-center"><i data-lucide="save" class="w-4 h-4 me-1"></i> Salvar</button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
