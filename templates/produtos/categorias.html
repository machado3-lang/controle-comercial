{% extends "base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-tags"></i> Categorias de Produtos</h4>
    <a href="/produtos" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<div class="table-responsive">
    <table class="table table-hover">
        <thead><tr><th>Nome</th><th>Ações</th></tr></thead>
        <tbody>
            {% for c in categorias %}
            <tr>
                <td>{{ c.nome }}</td>
                <td><a href="/produtos/categorias/excluir/{{ c.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Excluir?')"><i class="bi bi-trash"></i></a></td>
            </tr>
            {% else %}
            <tr><td colspan="2" class="text-center text-muted">Nenhuma categoria</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovo"><i class="bi bi-plus-circle"></i> Nova Categoria</button>

<div class="modal fade" id="modalNovo">
    <div class="modal-dialog">
        <form method="post" action="/produtos/categorias/nova" class="modal-content">
            <div class="modal-header"><h5>Nova Categoria</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><input type="text" class="form-control" name="nome" placeholder="Nome da categoria..." required></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button></div>
        </form>
    </div>
</div>
{% endblock %}
