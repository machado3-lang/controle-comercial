{% extends "base.html" %}
{% block title %}{{ "Novo" if not editar else "Editar" }} Produto{% endblock %}
{% block content %}
<div class="glass-card mb-6">
    <div class="p-4 border-b border-slate-800/60 flex justify-between items-center">
        <h4 class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-semibold"><i data-lucide="package" class="w-6 h-6 inline me-2"></i> {{ "Novo" if not editar else "Editar" }} Produto</h4>
    </div>
    
    <form method="post" enctype="multipart/form-data" class="p-4">
        <input type="hidden" name="situacao" id="situacaoInput" value="A">
        <div class="flex flex-col md:flex-row gap-4">
            <div class="text-center">
                <label class="block text-sm font-medium text-cyan-400 mb-2">Foto do Produto</label>
                <div class="border-2 border-dashed border-slate-700 rounded-xl w-36 h-36 flex items-center justify-center mb-2 bg-slate-900/50 mx-auto">
                    {% if produto and produto.foto %}
                        <img src="{{ produto.foto }}" class="max-h-32 max-w-32 object-contain rounded">
                    {% else %}
                        <i data-lucide="image" class="w-10 h-10 text-slate-600"></i>
                    {% endif %}
                </div>
                <input type="file" class="text-xs text-slate-400" name="foto" accept="image/*">
            </div>
            
            <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Código</label><input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="codigo" value="{{ produto.codigo or '' }}"></div>
                <div class="md:col-span-2"><label class="block text-xs font-medium text-cyan-400 mb-1">Nome *</label><input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="nome" required value="{{ produto.nome or '' }}"></div>
                <div class="md:col-span-3"><label class="block text-xs font-medium text-cyan-400 mb-1">Descrição</label><textarea class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="descricao" rows="1">{{ produto.descricao or '' }}</textarea></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-emerald-400 mb-1">Marca</label>
                    <select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="marca_id">
                        <option value="">Selecione...</option>
                        {% for m in marcas %}<option value="{{ m.id }}" {% if produto and produto.marca_id == m.id %}selected{% endif %}>{{ m.nome }}</option>{% endfor %}
                    </select>
                </div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Categoria</label><select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="categoria_id"><option value="">Selecione...</option>{% for c in categorias %}<option value="{{ c.id }}" {% if produto and produto.categoria_id == c.id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Tipo</label><select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="tipo"><option value="produto" {% if not produto or produto.tipo == 'produto' %}selected{% endif %}>Produto</option><option value="servico" {% if produto and produto.tipo == 'servico' %}selected{% endif %}>Serviço</option></select></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Fornecedor</label><select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="fornecedor_id"><option value="">Selecione...</option>{% for f in fornecedores %}<option value="{{ f.id }}" {% if produto and produto.fornecedor_id == f.id %}selected{% endif %}>{{ f.nome }}</option>{% endfor %}</select></div>
                <div class="md:col-span-3 flex gap-2">
                    <div class="flex-1"><label class="block text-xs font-medium text-rose-400 mb-1">Preço Custo</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-rose-500/50" name="preco_custo" id="precoCusto" value="{{ produto.preco_custo or '' }}"></div>
                    <div class="w-24"><label class="block text-xs font-medium text-cyan-400 mb-1">Margem %</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="margem" id="margemInput" value=""></div>
                    <div class="flex-1"><label class="block text-xs font-medium text-emerald-400 mb-1">Preço Venda *</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="preco" id="precoVenda" required value="{{ produto.preco or '' }}"></div>
                </div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Unidade</label><input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="unidade" value="{{ produto.unidade or 'UN' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">NCM</label><input type="text" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="ncm" value="{{ produto.ncm or '' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Altura</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="altura" value="{{ produto.altura or '' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Largura</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="largura" value="{{ produto.largura or '' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Profund.</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="profundidade" value="{{ produto.profundidade or '' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Peso Líq</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="peso_liq" value="{{ produto.peso_liq or '' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Peso Brut</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="peso_bruto" value="{{ produto.peso_bruto or '' }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-cyan-400 mb-1">Unid. Med.</label><select class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="unidade_medida">{% for u in UNIDADES_MEDIDA %}<option value="{{ u }}" {% if produto and produto.unidade_medida == u %}selected{% endif %}>{{ u }}</option>{% endfor %}</select></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-emerald-400 mb-1">Estoque</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="estoque" value="{{ produto.estoque or 0 }}"></div>
                <div class="md:col-span-1"><label class="block text-xs font-medium text-emerald-400 mb-1">Estoque Min.</label><input type="number" step="0.01" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-emerald-500/50" name="estoque_minimo" value="{{ produto.estoque_minimo or 0 }}"></div>
                <div class="md:col-span-3 flex justify-end gap-2 mt-2">
                    <button type="button" id="situacaoToggle" class="px-3 py-2 rounded-xl text-xs font-medium {% if produto and produto.situacao != 'A' %}bg-rose-950/50 text-rose-400 border border-rose-800/50{% else %}bg-emerald-950/50 text-emerald-400 border border-emerald-800/50{% endif %}">{% if produto and produto.situacao != 'A' %}Inativo{% else %}Ativo{% endif %}</button>
                    <a href="/produtos" class="px-4 py-2 text-slate-300 border border-slate-700 rounded-xl hover:bg-slate-800/50 transition flex items-center"><i data-lucide="x" class="w-4 h-4 me-1"></i> Cancelar</a>
                    <button type="submit" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all flex items-center"><i data-lucide="save" class="w-4 h-4 me-1"></i> Salvar</button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const precoCusto = document.getElementById('precoCusto');
const precoVenda = document.getElementById('precoVenda');
const margemInput = document.getElementById('margemInput');
const situacaoToggle = document.getElementById('situacaoToggle');
const situacaoHidden = document.getElementById('situacaoInput');

function calcMargem() {
    const custo = parseFloat(precoCusto.value) || 0;
    const venda = parseFloat(precoVenda.value) || 0;
    if (custo > 0 && venda > 0) {
        margemInput.value = ((venda - custo) / custo * 100).toFixed(2);
    }
}

precoCusto.addEventListener('input', function() {
    if (precoCusto.value && margemInput.value) {
        const custo = parseFloat(precoCusto.value) || 0;
        const margem = parseFloat(margemInput.value) || 0;
        precoVenda.value = (custo * (1 + margem / 100)).toFixed(2);
    }
});

margemInput.addEventListener('input', function() {
    const custo = parseFloat(precoCusto.value) || 0;
    const margem = parseFloat(margemInput.value) || 0;
    precoVenda.value = (custo * (1 + margem / 100)).toFixed(2);
});

precoVenda.addEventListener('input', calcMargem);

situacaoToggle.addEventListener('click', function() {
    if (situacaoHidden.value === 'A') {
        situacaoHidden.value = 'I';
        situacaoToggle.textContent = 'Inativo';
        situacaoToggle.className = 'px-3 py-2 rounded-xl text-xs font-medium bg-rose-950/50 text-rose-400 border border-rose-800/50';
    } else {
        situacaoHidden.value = 'A';
        situacaoToggle.textContent = 'Ativo';
        situacaoToggle.className = 'px-3 py-2 rounded-xl text-xs font-medium bg-emerald-950/50 text-emerald-400 border border-emerald-800/50';
    }
});
document.addEventListener('DOMContentLoaded', function() { lucide.createIcons(); });
</script>
{% endblock %}
