{% extends "base.html" %}
{% block title %}Editar Produto{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-box"></i> Editar Produto</h4>

<form method="post" class="row g-3">
    <div class="col-md-4"><label class="form-label">Código</label><input type="text" class="form-control" name="codigo" value="{{ produto.codigo or '' }}"></div>
    <div class="col-md-8"><label class="form-label">Nome *</label><input type="text" class="form-control" name="nome" required value="{{ produto.nome }}"></div>
    <div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="2">{{ produto.descricao or '' }}</textarea></div>
    <div class="col-md-4"><label class="form-label">Fornecedor</label><select class="form-select" name="fornecedor_id"><option value="">Selecione...</option>{% for f in fornecedores %}<option value="{{ f.id }}" {{ 'selected' if produto.fornecedor_id == f.id }}>{{ f.nome }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Categoria</label><select class="form-select" name="categoria_id"><option value="">Selecione...</option>{% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if produto.categoria_id == c.id }}>{{ c.nome }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Marca</label><input type="text" class="form-control" name="marca" value="{{ produto.marca or '' }}"></div>
    <div class="col-md-4"><label class="form-label">NCM</label><input type="text" class="form-control" name="ncm" value="{{ produto.ncm or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Preço Venda *</label><input type="number" step="0.01" class="form-control" name="preco" required value="{{ produto.preco }}"></div>
    <div class="col-md-4"><label class="form-label">Preço Custo</label><input type="number" step="0.01" class="form-control" name="preco_custo" value="{{ produto.preco_custo or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Unidade</label><input type="text" class="form-control" name="unidade" value="{{ produto.unidade or 'UN' }}"></div>
    <div class="col-md-3"><label class="form-label">Peso Líq (kg)</label><input type="number" step="0.01" class="form-control" name="peso_liq" value="{{ produto.peso_liq or '' }}"></div>
    <div class="col-md-3"><label class="form-label">Peso Bruto (kg)</label><input type="number" step="0.01" class="form-control" name="peso_bruto" value="{{ produto.peso_bruto or '' }}"></div>
    <div class="col-md-2"><label class="form-label">Altura</label><input type="number" step="0.01" class="form-control" name="altura" value="{{ produto.altura or '' }}"></div>
    <div class="col-md-2"><label class="form-label">Largura</label><input type="number" step="0.01" class="form-control" name="largura" value="{{ produto.largura or '' }}"></div>
    <div class="col-md-2"><label class="form-label">Profundidade</label><input type="number" step="0.01" class="form-control" name="profundidade" value="{{ produto.profundidade or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Unidade Medida</label><select class="form-select" name="unidade_medida">{% for u in UNIDADES_MEDIDA %}<option value="{{ u }}" {{ 'selected' if produto.unidade_medida == u }}>{{ u }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Estoque</label><input type="number" step="0.01" class="form-control" name="estoque" value="{{ produto.estoque or '0' }}"></div>
    <div class="col-md-4"><label class="form-label">Estoque Mínimo</label><input type="number" step="0.01" class="form-control" name="estoque_minimo" value="{{ produto.estoque_minimo or '0' }}"></div>
    <div class="col-12"><button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button><a href="/produtos" class="btn btn-secondary">Cancelar</a></div>
</form>
{% endblock %}
