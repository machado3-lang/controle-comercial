{% extends "base.html" %}
{% block title %}Nova Ordem de Serviço{% endblock %}
{% block content %}
<h4 class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-semibold mb-6">
    <i data-lucide="wrench" class="w-6 h-6 inline me-2"></i> Nova Ordem de Serviço
</h4>

<form method="post" action="/ordens-servico/nova" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="glass-card p-4">
        <h5 class="text-cyan-400 border-b border-slate-800/50 pb-2 mb-3"><i data-lucide="clipboard" class="w-4 h-4 inline me-1"></i> Dados do Equipamento</h5>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Cliente *</label>
            <input type="text" id="clienteSearchOS" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" placeholder="Digite para buscar cliente..." autocomplete="off">
            <div id="clienteDropdownOS" class="absolute z-[1000] w-full bg-slate-900/90 backdrop-blur-md border border-slate-700/50 rounded-xl mt-1 hidden max-h-60 overflow-y-auto"></div>
            <select class="hidden" name="cliente_id" id="clienteIdOS">
                <option value="">Selecione...</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Equipamento *</label>
            <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="equipamento" required>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
                <label class="form-label text-cyan-300">Marca</label>
                <select class="form-select bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="marca_id" id="marcaSelectOS">
                    <option value="">Selecione...</option>
                    {% for m in marcas %}
                    <option value="{{ m.id }}">{{ m.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label text-cyan-300">Modelo</label>
                <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="modelo">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Número de Série</label>
            <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="numero_serie">
        </div>
    </div>

    <div class="glass-card p-4">
        <h5 class="text-cyan-400 border-b border-slate-800/50 pb-2 mb-3"><i data-lucide="file-text" class="w-4 h-4 inline me-1"></i> Detalhes da OS</h5>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Técnico</label>
            <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="tecnico">
        </div>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Autorizado por</label>
            <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="autorizado_por" placeholder="Nome de quem autorizou">
        </div>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Nº Requisição do Cliente</label>
            <input type="text" class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="numero_requisicao" placeholder="Número do protocolo/requisição">
        </div>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Defeito Relatado</label>
            <textarea class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="defeito_relatado" rows="4"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label text-cyan-300">Observação</label>
            <textarea class="form-control bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" name="observacao" rows="3"></textarea>
        </div>
    </div>

    <div class="lg:col-span-2 flex items-center gap-3">
        <button type="submit" class="flex items-center px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/10"><i data-lucide="save" class="w-4 h-4 me-1"></i> Criar OS</button>
        <a href="/ordens-servico" class="px-4 py-2 border border-slate-800/80 rounded-xl text-slate-300 hover:bg-slate-800/50 transition">Cancelar</a>
    </div>
</form>
{% endblock %}
{% block scripts %}
<script>
const clientes_json = {{ clientes_json|tojson }};
const marcas_json = {{ marcas_json|tojson }};
const servicos_json = {{ servicos_json|tojson }};
const pecas_json = {{ pecas_json|tojson }};
document.addEventListener('DOMContentLoaded', function() {
    lucide.createIcons();
    // Busca cliente
    const clienteSearch = document.getElementById('clienteSearchOS');
    const clienteDropdown = document.getElementById('clienteDropdownOS');
    if (clienteSearch) {
        clienteSearch.addEventListener('input', function(e) {
            const term = e.target.value;
            if (term.length >= 2) {
                fetch(`/clientes/buscar?q=${encodeURIComponent(term)}`).then(r => r.json()).then(d => {
                    if (d.clientes && d.clientes.length > 0) {
                        clienteDropdown.innerHTML = d.clientes.map(c => `<div class="p-2.5 hover:bg-slate-800/50 cursor-pointer transition" data-id="${c.id}">${c.nome}</div>`).join('');
                        clienteDropdown.classList.remove('hidden');
                    } else {
                        clienteDropdown.classList.add('hidden');
                    }
                });
            } else {
                clienteDropdown.classList.add('hidden');
            }
        });
    }
    if (clienteDropdown) {
        clienteDropdown.addEventListener('click', function(e) {
            const item = e.target.closest('[data-id]');
            if (item) {
                clienteSearch.value = item.textContent;
                const select = document.getElementById('clienteIdOS');
                let opt = select.querySelector(`option[value="${item.dataset.id}"]`);
                if (!opt) {
                    opt = document.createElement('option');
                    opt.value = item.dataset.id;
                    opt.textContent = item.textContent;
                    opt.selected = true;
                    select.appendChild(opt);
                } else {
                    opt.selected = true;
                }
                this.classList.add('hidden');
            }
        });
    }
});
</script>
{% endblock %}
