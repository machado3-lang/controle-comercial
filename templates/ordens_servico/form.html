{% extends "base.html" %}
{% block title %}Nova Ordem de Serviço{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-wrench"></i> Nova Ordem de Serviço</h4>

<form method="post" action="/ordens-servico/nova" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">Cliente *</label>
        <select class="form-select" name="cliente_id" required>
            <option value="">Selecione...</option>
            {% for c in clientes %}
            <option value="{{ c.id }}">{{ c.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Equipamento *</label>
        <input type="text" class="form-control" name="equipamento" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Técnico</label>
        <input type="text" class="form-control" name="tecnico">
    </div>
    <div class="col-md-4">
        <label class="form-label">Marca</label>
        <input type="text" class="form-control" name="marca">
    </div>
    <div class="col-md-4">
        <label class="form-label">Modelo</label>
        <input type="text" class="form-control" name="modelo">
    </div>
    <div class="col-md-4">
        <label class="form-label">Número de Série</label>
        <input type="text" class="form-control" name="numero_serie">
    </div>
    <div class="col-12">
        <label class="form-label">Defeito Relatado</label>
        <textarea class="form-control" name="defeito_relatado" rows="3"></textarea>
    </div>
    <div class="col-md-6">
        <label class="form-label">Autorizado por</label>
        <input type="text" class="form-control" name="autorizado_por" placeholder="Nome de quem autorizou">
    </div>
    <div class="col-md-6">
        <label class="form-label">Nº Requisição do Cliente</label>
        <input type="text" class="form-control" name="numero_requisicao" placeholder="Número do protocolo/requisição">
    </div>
    <div class="col-12">
        <label class="form-label">Observação</label>
        <textarea class="form-control" name="observacao" rows="2"></textarea>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Criar OS</button>
        <a href="/ordens-servico" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
