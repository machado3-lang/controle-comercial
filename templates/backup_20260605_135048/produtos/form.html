{% extends "base.html" %}
{% block title %}Editar Produto{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0"><i class="bi bi-box"></i> Editar Produto</h4>
            <small class="opacity-75">ID: {{ produto.id }}</small>
        </div>
        <a href="/produtos" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    
    <form method="post" enctype="multipart/form-data" class="card-body">
        <div class="row g-4">
            <!-- Coluna Foto -->
            <div class="col-md-4">
                <div class="text-center">
                    <label class="form-label fw-semibold">Foto do Produto</label>
                    <div class="border rounded bg-light d-flex align-items-center justify-content-center mb-2" style="height:150px; width:150px; margin:auto;">
                        {% if produto.foto %}
                            <img src="{{ produto.foto }}" style="max-height:140px; max-width:140px; object-fit:contain;" class="rounded">
                        {% else %}
                            <i class="bi bi-image text-muted" style="font-size:3rem;"></i>
                        {% endif %}
                    </div>
                    <input type="file" class="form-control form-control-sm" name="foto" accept="image/*">
                </div>
            </div>
            
            <!-- Coluna Dados -->
            <div class="col-md-8">
                <div class="row g-3">
                    <div class="col-12">
                        <h6 class="text-uppercase text-muted small fw-bold border-bottom pb-1 mb-2">Informações Principais</h6>
                    </div>
                    
                    <div class="col-sm-4"><label class="form-label">Código</label><input type="text" class="form-control" name="codigo" value="{{ produto.codigo or '' }}"></div>
                    <div class="col-sm-8"><label class="form-label">Nome *</label><input type="text" class="form-control" name="nome" required value="{{ produto.nome }}"></div>
                    
                    <div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="2">{{ produto.descricao or '' }}</textarea></div>
                    
                    <div class="col-sm-4"><label class="form-label">Marca</label>
                        <div class="input-group">
                            <select class="form-select" name="marca_id">
                                <option value="">Selecione...</option>
                                {% for m in marcas %}<option value="{{ m.id }}" {{ 'selected' if produto.marca_id == m.id }}>{{ m.nome }}</option>{% endfor %}
                            </select>
                            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalMarca"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                    <div class="col-sm-4"><label class="form-label">Categoria</label><select class="form-select" name="categoria_id"><option value="">Selecione...</option>{% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if produto.categoria_id == c.id }}>{{ c.nome }}</option>{% endfor %}</select></div>
                    <div class="col-sm-4"><label class="form-label">Fornecedor</label><select class="form-select" name="fornecedor_id"><option value="">Selecione...</option>{% for f in fornecedores %}<option value="{{ f.id }}" {{ 'selected' if produto.fornecedor_id == f.id }}>{{ f.nome }}</option>{% endfor %}</select></div>
                    
                    <div class="col-12">
                        <h6 class="text-uppercase text-muted small fw-bold border-bottom pb-1 mb-2">Preços</h6>
                    </div>
                    
                    <div class="col-sm-4"><label class="form-label">Preço Venda *</label><input type="number" step="0.01" class="form-control" name="preco" required value="{{ produto.preco }}"></div>
                    <div class="col-sm-4"><label class="form-label">Preço Custo</label><input type="number" step="0.01" class="form-control" name="preco_custo" value="{{ produto.preco_custo or '' }}"></div>
                    <div class="col-sm-2"><label class="form-label">Unidade</label><input type="text" class="form-control" name="unidade" value="{{ produto.unidade or 'UN' }}"></div>
                    <div class="col-sm-2"><label class="form-label">NCM</label><input type="text" class="form-control" name="ncm" value="{{ produto.ncm or '' }}"></div>
                    
                    <div class="col-12">
                        <h6 class="text-uppercase text-muted small fw-bold border-bottom pb-1 mb-2">Dimensões e Peso</h6>
                    </div>
                    
                    <div class="col-sm-2"><label class="form-label">Altura</label><input type="number" step="0.01" class="form-control" name="altura" value="{{ produto.altura or '' }}"></div>
                    <div class="col-sm-2"><label class="form-label">Largura</label><input type="number" step="0.01" class="form-control" name="largura" value="{{ produto.largura or '' }}"></div>
                    <div class="col-sm-2"><label class="form-label">Profund.</label><input type="number" step="0.01" class="form-control" name="profundidade" value="{{ produto.profundidade or '' }}"></div>
                    <div class="col-sm-2"><label class="form-label">Peso Líq</label><input type="number" step="0.01" class="form-control" name="peso_liq" value="{{ produto.peso_liq or '' }}"></div>
                    <div class="col-sm-2"><label class="form-label">Peso Brut</label><input type="number" step="0.01" class="form-control" name="peso_bruto" value="{{ produto.peso_bruto or '' }}"></div>
                    <div class="col-sm-2"><label class="form-label">Unid. Med.</label><select class="form-select" name="unidade_medida">{% for u in UNIDADES_MEDIDA %}<option value="{{ u }}" {{ 'selected' if produto.unidade_medida == u }}>{{ u }}</option>{% endfor %}</select></div>
                    
                    <div class="col-sm-3"><label class="form-label">Estoque</label><input type="number" step="0.01" class="form-control" name="estoque" value="{{ produto.estoque or 0 }}"></div>
                    <div class="col-sm-3"><label class="form-label">Estoque Min.</label><input type="number" step="0.01" class="form-control" name="estoque_minimo" value="{{ produto.estoque_minimo or 0 }}"></div>
                    
                    <div class="col-12 text-end">
                        <a href="/produtos" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="modal fade" id="modalMarca">
    <div class="modal-dialog">
        <form method="post" action="/produtos/marcas/nova" class="modal-content">
            <div class="modal-header"><h5>Nova Marca</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><input type="text" class="form-control" name="nome" placeholder="Nome da marca" required></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button></div>
        </form>
    </div>
</div>
{% endblock %}
