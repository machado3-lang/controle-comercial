{% extends "base.html" %}
{% block title %}Erro{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-24 text-center">
    <div class="text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-red-400 mb-4">{{ status_code }}</div>
    <div class="text-slate-300 text-lg mb-2">{{ mensagem }}</div>
    {% if detalhes and request.session.get('user_id') %}
    <pre class="mt-6 p-4 bg-slate-900/80 border border-slate-800/80 rounded-xl text-left text-xs text-slate-400 overflow-auto max-h-48">{{ detalhes }}</pre>
    {% endif %}
    <a href="/" class="inline-flex items-center mt-8 px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/10">
        <i data-lucide="home" class="w-4 h-4 me-2"></i> Voltar ao Início
    </a>
</div>
{% endblock %}
