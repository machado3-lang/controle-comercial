{% extends "base.html" %}
{% block title %}Sicoob - Controle Comercial{% endblock %}
{% block content %}
<h2><i class="bi bi-credit-card"></i> Sicoob</h2>

<div class="col-md-6 d-grid gap-2">
    <a href="/sicoob/boletos" class="btn btn-outline-info">
        <i class="bi bi-credit-card"></i> Ver Boletos Sicoob
    </a>
    <a href="/contas/receber" class="btn btn-outline-primary">
        <i class="bi bi-arrow-down-circle"></i> Contas a Receber
    </a>
</div>

<div class="mt-3">
    <h5>Status da Integração</h5>
    <p>
        Credenciais configuradas: 
        {% if empresa and empresa.sicoob_client_id %}
            <span class="badge bg-success">Sim</span>
        {% else %}
            <span class="badge bg-warning">Não</span>
        {% endif %}
    </p>
</div>
{% endblock %}
