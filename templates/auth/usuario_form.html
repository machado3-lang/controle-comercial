{% extends "base.html" %}
{% block title %}{{ 'Editar' if usuario else 'Novo' }} Usuário - Controle Comercial{% endblock %}
{% block content %}
<div class="glass-card mb-6">
    <div class="p-4 border-b border-slate-800/60 flex justify-between items-center">
        <h4 class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-semibold"><i data-lucide="user-cog" class="w-6 h-6 inline me-2"></i> {{ 'Editar' if usuario else 'Novo' }} Usuário</h4>
        <a href="/auth/usuarios" class="flex items-center px-3 py-2 text-slate-300 border border-slate-700 rounded-xl hover:bg-slate-800/50 transition"><i data-lucide="arrow-left" class="w-4 h-4 me-1"></i> Cancelar</a>
    </div>
    
    <form method="post" action="{{ '/auth/usuarios/' + usuario.id|string + '/editar' if usuario else '/auth/usuarios/novo' }}" class="p-4 max-w-lg grid grid-cols-1 gap-4">
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Nome *</label>
            <input type="text" name="nome" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" value="{{ usuario.nome if usuario else '' }}" required>
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Email *</label>
            <input type="email" name="email" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" value="{{ usuario.email if usuario else '' }}" required>
        </div>
        <div><label class="block text-xs font-medium text-cyan-400 mb-1">Senha {{ 'nova' if usuario else ' *' }}</label>
            <input type="password" name="senha" class="w-full px-3 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" {% if not usuario %}required{% endif %}>
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" name="ativo" class="w-4 h-4 bg-slate-900/60 border border-slate-800/80 rounded" id="ativo" {% if not usuario or usuario.ativo %}checked{% endif %}>
            <label for="ativo" class="text-slate-300 text-sm">Ativo</label>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="flex items-center px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/10"><i data-lucide="save" class="w-4 h-4 me-1"></i> Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
