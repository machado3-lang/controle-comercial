{% extends "base.html" %}
{% block title %}{{ 'Editar' if usuario else 'Novo' }} Usuário - Controle Comercial{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'Editar' if usuario else 'Novo' }} Usuário</h4>
<form method="post" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" value="{{ usuario.nome if usuario else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ usuario.email if usuario else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Senha {{ 'nova' if usuario else '' }}</label>
        <input type="password" name="senha" class="form-control" {{ 'required' if not usuario else '' }}>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="ativo" class="form-check-input" {{ 'checked' if not usuario or usuario.ativo else '' }}>
        <label class="form-check-label">Ativo</label>
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
    <a href="/auth/usuarios" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
