<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Controle Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyan: { 400: '#22d3ee', 500: '#06b6d4' },
                        emerald: { 400: '#34d399' },
                        indigo: { 400: '#818cf8', 500: '#6366f1' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950">
    <div class="w-full max-w-md">
        <div class="glass-card p-8">
            <div class="text-center mb-6">
                <img src="/static/img/controliz-logo-chanfro.png" alt="Control iZ" class="h-8 w-auto mb-2 mx-auto">
                <p class="text-slate-400">Redefinir Senha</p>
            </div>

            {% if message %}
            <div class="bg-{{ 'emerald' if message.tipo == 'success' else 'rose' }}-950/30 border border-{{ 'emerald' if message.tipo == 'success' else 'rose' }}-800/50 text-{{ 'emerald' if message.tipo == 'success' else 'rose' }}-300 px-4 py-3 rounded-xl mb-4">{{ message.texto }}</div>
            {% endif %}

            <form method="post" action="/auth/reset-senha">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-cyan-400 mb-1">Nova senha</label>
                    <input type="password" name="nova_senha" class="w-full px-4 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" required minlength="6">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-cyan-400 mb-1">Confirmar senha</label>
                    <input type="password" name="confirmar_senha" class="w-full px-4 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" required minlength="6">
                </div>
                <button type="submit" class="w-full flex items-center justify-center px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all"><i data-lucide="key" class="w-4 h-4 me-2"></i> Redefinir senha</button>
            </form>
            <div class="text-center mt-4"><a href="/auth/login" class="text-xs text-cyan-400 hover:text-cyan-300 transition">Voltar ao login</a></div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
