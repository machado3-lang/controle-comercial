<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyan: { 400: '#22d3ee', 500: '#06b6d4' },
                        emerald: { 400: '#34d399' },
                        indigo: { 400: '#818cf8', 500: '#6366f1' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950">
    <div class="w-full max-w-md">
        <div class="glass-card p-8">
            <div class="text-center mb-6">
                <img src="/static/img/controliz-logo-chanfro.png" alt="Control iZ" class="h-8 w-auto mb-2 mx-auto">
                <p class="text-slate-400">Controle Comercial</p>
            </div>
            
            {% if message %}
            <div class="bg-rose-950/30 border border-rose-800/50 text-rose-300 px-4 py-3 rounded-xl mb-4 flex justify-between items-center">
                {{ message.texto }}
                <button type="button" class="text-slate-400 hover:text-slate-200" onclick="this.parentElement.remove()"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            {% endif %}
            
            <form method="post" action="/auth/login">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-cyan-400 mb-1">Email</label>
                    <input type="email" name="email" class="w-full px-4 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-cyan-400 mb-1">Senha</label>
                    <input type="password" name="senha" class="w-full px-4 py-2 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-100 focus:border-cyan-500/50" required>
                </div>
                <button type="submit" class="w-full flex items-center justify-center px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/10"><i data-lucide="log-in" class="w-4 h-4 me-2"></i> Entrar</button>
            </form>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
